<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NestLayer Architecture</title>
  <desc>Diagrama de capas: HTTP Request → Controller → Service → Prisma → PostgreSQL</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="340" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">NestLayer — request flow</text>
  <text x="340" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#888780">cada capa tiene una sola responsabilidad</text>

  <!-- HTTP Request -->
  <rect x="200" y="68" width="280" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">HTTP request</text>
  <text x="340" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">POST /auth/login  •  Bearer token</text>

  <!-- Arrow 1 -->
  <line x1="340" y1="120" x2="340" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ValidationPipe badge -->
  <rect x="430" y="128" width="170" height="30" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="515" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#633806">ValidationPipe + DTO</text>
  <line x1="430" y1="143" x2="406" y2="163" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Controller -->
  <rect x="200" y="150" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Controller</text>
  <text x="340" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#185FA5">recibe y delega — sin lógica</text>

  <!-- Guard badge -->
  <rect x="430" y="158" width="170" height="30" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="515" y="177" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#712B13">JwtAuthGuard / RolesGuard</text>
  <line x1="430" y1="173" x2="480" y2="173" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Arrow 2 -->
  <line x1="340" y1="202" x2="340" y2="232" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Service -->
  <rect x="200" y="232" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#085041">Service</text>
  <text x="340" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0F6E56">lógica de negocio + bcrypt</text>

  <!-- CurrentUser badge -->
  <rect x="430" y="240" width="170" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="515" y="259" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3C3489">@CurrentUser decorator</text>
  <line x1="430" y1="255" x2="480" y2="255" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Arrow 3 -->
  <line x1="340" y1="284" x2="340" y2="314" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Prisma -->
  <rect x="200" y="314" width="280" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#27500A">Prisma ORM</text>
  <text x="340" y="354" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3B6D11">traduce TypeScript a SQL</text>

  <!-- Arrow 4 -->
  <line x1="340" y1="366" x2="340" y2="396" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="200" y="396" width="280" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">PostgreSQL</text>
  <text x="340" y="436" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">base de datos relacional</text>

  <!-- Error filter badge -->
  <rect x="430" y="404" width="170" height="30" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="515" y="423" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#791F1F">GlobalExceptionFilter</text>
  <line x1="430" y1="419" x2="480" y2="419" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Return arrow (left side) -->
  <path d="M200 422 L140 422 L140 94 L200 94" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="5 3" marker-end="url(#arrow-ret)"/>
  <text x="110" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780" transform="rotate(-90, 110, 258)">JSON response</text>

  <!-- Legend -->
  <text x="340" y="476" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780">— — — elementos de apoyo (guards, decorators, filters)</text>
  <text x="340" y="494" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780">github.com/cedriccreed/nestlayer</text>
</svg>
